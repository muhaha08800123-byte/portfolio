      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#scifiGrad)"/>

  <!-- Futuristic Sci-fi Portal / 3D Torus -->
  <circle cx="400" cy="250" r="130" fill="none" stroke="#2962FF" stroke-width="24" opacity="0.8"/>
  <circle cx="400" cy="250" r="110" fill="none" stroke="#00B8D4" stroke-width="12" stroke-dasharray="20,15" opacity="0.9"/>
  <circle cx="400" cy="250" r="85" fill="#E0F7FA" opacity="0.2"/>
  <circle cx="400" cy="250" r="60" fill="#00B8D4" opacity="0.4" filter="drop-shadow(0 0 25px #00B8D4)"/>

