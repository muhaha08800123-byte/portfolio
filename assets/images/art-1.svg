<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <radialGradient id="neonSphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="40%" stop-color="#00B8D4"/>
      <stop offset="80%" stop-color="#2962FF"/>
      <stop offset="100%" stop-color="#303F9F"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgArt)"/>
  <circle cx="400" cy="250" r="140" fill="url(#neonSphere)" filter="drop-shadow(0 0 35px #00B8D4)"/>
  
  <!-- Digital brush strokes and vector artwork lines -->
  <path d="M 150 400 Q 300 150, 450 350 T 700 200" fill="none" stroke="#E0F7FA" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 100 200 Q 250 350, 500 180 T 750 380" fill="none" stroke="#2962FF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="200" cy="180" r="15" fill="#00B8D4"/>
  <circle cx="620" cy="320" r="22" fill="#2962FF"/>
  <circle cx="580" cy="140" r="10" fill="#E0F7FA"/>

  <!-- Geometric Frame & Tag -->
  <rect x="40" y="40" width="720" height="420" rx="16" fill="none" stroke="rgba(224, 247, 250, 0.2)" stroke-width="2"/>
  <text x="70" y="85" fill="#E0F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" letter-spacing="2">DIGITAL ILLUSTRATION // งานวาดดิจิทัล</text>
  <text x="70" y="115" fill="#00B8D4" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Concept Art & Cyber Aesthetic Characters</text>
</svg>

