<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2962FF"/>
      <stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="550" fill="url(#bgGrad)"/>
  
  <!-- Cyber Background Elements -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="#2962FF" stroke-width="2" stroke-dasharray="6,8" opacity="0.4"/>
  <circle cx="250" cy="220" r="190" fill="none" stroke="#00B8D4" stroke-width="1.5" stroke-dasharray="14,14" opacity="0.3"/>
  <circle cx="250" cy="220" r="140" fill="url(#pGrad)" opacity="0.12"/>
  
  <!-- Cool Creative Media Geometric Accents -->
  <polygon points="100,80 120,60 140,80 120,100" fill="none" stroke="#00B8D4" stroke-width="2" opacity="0.6"/>
  <polygon points="380,120 400,100 420,120 400,140" fill="none" stroke="#2962FF" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="250" x2="100" y2="250" stroke="#00B8D4" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="250" x2="450" y2="250" stroke="#2962FF" stroke-width="2" opacity="0.5"/>

  <!-- Character Silhouette / Modern Creative Avatar -->
  <!-- Shoulders & Upper Body -->
  <path d="M120 520 C120 400, 180 370, 250 370 C320 370, 380 400, 380 520 Z" fill="url(#pGrad)" opacity="0.9"/>
  <!-- Jacket Collar Details -->
  <path d="M210 380 L250 440 L290 380" fill="none" stroke="#E0F7FA" stroke-width="3"/>
  <line x1="250" y1="440" x2="250" y2="520" stroke="#E0F7FA" stroke-width="3" opacity="0.7"/>

  <!-- Neck -->
  <rect x="230" y="320" width="40" height="60" rx="8" fill="#F8FAFC" opacity="0.95"/>
  
  <!-- Head Base -->
  <ellipse cx="250" cy="250" rx="65" ry="75" fill="#F8FAFC"/>
  
  <!-- Modern Hair Style -->
  <path d="M175 250 C175 160, 200 130, 250 130 C300 130, 325 160, 325 250 C325 210, 305 170, 250 170 C195 170, 175 210, 175 250 Z" fill="#0B0F19"/>
  <path d="M170 230 C185 140, 240 120, 280 130 C320 140, 335 180, 330 240 C310 180, 280 150, 230 160 C190 170, 175 200, 170 230 Z" fill="#2962FF"/>
  <path d="M185 190 Q220 150 270 170" fill="none" stroke="#00B8D4" stroke-width="4" stroke-linecap="round"/>

  <!-- Cool Tech Cyber Glasses / Creative Specs -->
  <rect x="195" y="225" width="48" height="28" rx="6" fill="rgba(0, 184, 212, 0.25)" stroke="#00B8D4" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="257" y="225" width="48" height="28" rx="6" fill="rgba(41, 98, 255, 0.25)" stroke="#2962FF" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="243" y1="239" x2="257" y2="239" stroke="#00B8D4" stroke-width="2.5"/>
  <line x1="185" y1="235" x2="195" y2="237" stroke="#00B8D4" stroke-width="2"/>
  <line x1="305" y1="237" x2="315" y2="235" stroke="#2962FF" stroke-width="2"/>
  
  <!-- Subtle smile -->
  <path d="M235 285 Q250 295 265 285" fill="none" stroke="#303F9F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Overlay Badges / Creative Tech Icons -->
  <g transform="translate(60, 430)">
    <rect width="130" height="34" rx="17" fill="rgba(11,15,25,0.85)" stroke="#00B8D4" stroke-width="1.5"/>
    <text x="65" y="21" fill="#E0F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🎨 CREATIVE MEDIA</text>
  </g>

  <g transform="translate(310, 430)">
    <rect width="130" height="34" rx="17" fill="rgba(11,15,25,0.85)" stroke="#2962FF" stroke-width="1.5"/>
    <text x="65" y="21" fill="#E0F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ MSU STUDENT</text>
  </g>
</svg>

